[project]
name = "spexxy"
version = "2.9.2"
description = "spectrum fitting package"
authors = [{ name = "Tim-Oliver Husser", email = "thusser@uni-goettingen.de" }]
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "numpy>=1.26.4,<3",
    "astropy>=6.0.1,<9",
    "pandas>=2.3.3,<4",
    "lmfit>=1.3.4,<2",
    "PyYAML>=6.0.3,<7",
    "matplotlib>=3.9.4,<4",
    "h5py>=3.14.0,<4",
    "PyQt5>=5.15.11,<6",
    "single-source>=0.4.0,<0.5",
    "scipy>=1.13.1,<2",
]

[project.scripts]
spexxy = "spexxy.cli.spexxy:main"
spexxytools = "spexxy.cli.spexxytools:main"

[dependency-groups]
dev = [
    "black>=25.11.0,<27",
    "pytest>=8.4.2,<10",
]

[tool.hatch.build.targets.sdist]
include = ["spexxy"]

[tool.hatch.build.targets.wheel]
include = ["spexxy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 120
target-version = ['py39', 'py311', 'py312']
