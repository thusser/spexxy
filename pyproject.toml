[project]
name = "spexxy"
version = "2.9.1"
description = "spectrum fitting package"
authors = [{ name = "Tim-Oliver Husser", email = "thusser@uni-goettingen.de" }]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "astropy>=7.1.0",
    "scipy>=1.16.0",
    "pandas>=2.3.1",
    "pyyaml>=6.0.2",
    "lmfit>=1.3.4",
    "matplotlib>=3.10.3",
    "pyqt5>=5.15.11",
    "h5py>=3.14.0",
    "single-source>=0.4.0",
    "numpy>=2.0.0",
]

[project.scripts]
spexxy = "spexxy.cli.spexxy:main"
spexxytools = "spexxy.cli.spexxytools:main"

[dependency-groups]
dev = [
    "black>=24.4.2,<25",
    "pytest>=8.2.2,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 120
target-version = ['py311']
